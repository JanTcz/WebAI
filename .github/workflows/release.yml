# A release from a version tag (v0.2.0): tests, then @jantcz/webai on npm and ghcr.io/jantcz/webai.
# npm publishing uses Trusted Publishing (OIDC): no token in the repository; the package's
# settings on npmjs.com name this repository and this workflow file.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./packages/webai/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --prefix examples/astro
      - run: npm test

  npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # Trusted Publishing needs npm 11.5.1 or newer
      - name: Publish unless this version is already on npm
        working-directory: packages/webai
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@jantcz/webai@$version" version >/dev/null 2>&1; then
            echo "@jantcz/webai@$version is already published"
          else
            npm publish --provenance --access public
          fi

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jantcz/webai
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/webai.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
